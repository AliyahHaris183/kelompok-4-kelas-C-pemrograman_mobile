name: catlendar
description: "Aplikasi untuk pemilik kucing: profil kucing, riwayat medis, riwayat perawatan, jadwal, kalender, dan pengingat."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (satu-satunya) dan navigasi
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Firebase (Auth, Firestore, FCM)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.0

  # Pengingat terjadwal di perangkat
  flutter_local_notifications: ^18.0.1

  # Klien HTTP untuk TheCatAPI dan Holiday Indonesia API
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
